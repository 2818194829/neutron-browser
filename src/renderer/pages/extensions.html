<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>扩展程序</title>
  <style>
    :root {
      --ext-bg: #ffffff;
      --ext-sidebar-bg: #f5f5f5;
      --ext-sidebar-hover: rgba(0,0,0,0.055);
      --ext-sidebar-selected: rgba(0,0,0,0.08);
      --ext-sidebar-selected-text: #0067c0;
      --ext-border: #e3e3e3;
      --ext-text: #202124;
      --ext-text-secondary: #666;
      --ext-text-tertiary: #999;
      --ext-card-bg: #ffffff;
      --ext-card-border: #e3e3e3;
      --ext-input-bg: #ffffff;
      --ext-input-border: #d1d1d1;
      --ext-accent: #0067c0;
      --ext-accent-light: rgba(0,103,192,0.16);
      --ext-danger: #c42b1c;
      --ext-danger-hover: rgba(196,43,28,0.08);
      --ext-toggle-on: #34a853;
      --ext-toggle-off: #b0b0b0;
      --ext-toggle-knob: #ffffff;
      --ext-scrollbar: rgba(0,0,0,0.28);
      --ext-scrollbar-hover: rgba(0,0,0,0.45);
      --ext-link: #0067c0;
      --ext-card-hover-shadow: 0 2px 8px rgba(0,0,0,0.08);
      --ext-group-title-color: #202124;
      --ext-button-bg: #ffffff;
      --ext-button-border: #d1d1d1;
      --ext-button-hover-bg: rgba(0,0,0,0.04);
      --ext-button-text: #202124;
      --ext-dev-button-bg: #ffffff;
      --ext-dev-button-border: #0067c0;
      --ext-dev-button-text: #0067c0;
      --ext-dev-button-hover-bg: rgba(0,103,192,0.06);
    }

    [data-theme="dark"] {
      --ext-bg: #1e1e26;
      --ext-sidebar-bg: #26262e;
      --ext-sidebar-hover: rgba(255,255,255,0.07);
      --ext-sidebar-selected: rgba(255,255,255,0.11);
      --ext-sidebar-selected-text: #70b5ff;
      --ext-border: #3b3b45;
      --ext-text: #f3f3f3;
      --ext-text-secondary: #aaa;
      --ext-text-tertiary: #777;
      --ext-card-bg: #2a2a34;
      --ext-card-border: #3b3b45;
      --ext-input-bg: #2b2b34;
      --ext-input-border: #444;
      --ext-accent: #70b5ff;
      --ext-accent-light: rgba(112,181,255,0.18);
      --ext-danger: #ff8a80;
      --ext-danger-hover: rgba(255,138,128,0.1);
      --ext-toggle-on: #34a853;
      --ext-toggle-off: #5a5a5a;
      --ext-toggle-knob: #ffffff;
      --ext-scrollbar: rgba(255,255,255,0.28);
      --ext-scrollbar-hover: rgba(255,255,255,0.45);
      --ext-link: #70b5ff;
      --ext-card-hover-shadow: 0 2px 8px rgba(0,0,0,0.3);
      --ext-group-title-color: #f3f3f3;
      --ext-button-bg: #2a2a34;
      --ext-button-border: #444;
      --ext-button-hover-bg: rgba(255,255,255,0.06);
      --ext-button-text: #e8eaed;
      --ext-dev-button-bg: #2a2a34;
      --ext-dev-button-border: #70b5ff;
      --ext-dev-button-text: #70b5ff;
      --ext-dev-button-hover-bg: rgba(112,181,255,0.08);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      font-size: 14px;
      background: var(--ext-bg);
      color: var(--ext-text);
      display: flex;
    }

    /* ==================== Scrollbar ==================== */
    .custom-scroll {
      scrollbar-width: thin;
      scrollbar-color: var(--ext-scrollbar) transparent;
    }
    .custom-scroll::-webkit-scrollbar { width: 10px; }
    .custom-scroll::-webkit-scrollbar-track { background: transparent; }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: var(--ext-scrollbar);
      border: 2px solid transparent;
      border-radius: 6px;
      background-clip: padding-box;
    }
    .custom-scroll::-webkit-scrollbar-thumb:hover {
      background: var(--ext-scrollbar-hover);
      border: 2px solid transparent;
      background-clip: padding-box;
    }

    /* ==================== Sidebar ==================== */
    .sidebar {
      width: 240px;
      min-width: 240px;
      height: 100vh;
      background: var(--ext-sidebar-bg);
      border-right: 1px solid var(--ext-border);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }
    .sidebar__title {
      padding: 24px 16px 16px;
      font-size: 20px;
      font-weight: 600;
      color: var(--ext-text);
      line-height: 28px;
    }
    .sidebar__search {
      margin: 0 12px 16px;
      position: relative;
    }
    .sidebar__search input {
      width: 100%;
      height: 32px;
      padding: 0 12px 0 34px;
      border: 1px solid var(--ext-input-border);
      border-radius: 6px;
      background: var(--ext-input-bg);
      color: var(--ext-text);
      font-size: 13px;
      line-height: 20px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .sidebar__search input:hover { border-color: var(--ext-text-secondary); }
    .sidebar__search input:focus {
      border-color: var(--ext-accent);
      box-shadow: 0 0 0 2px var(--ext-accent-light);
    }
    .sidebar__search input::placeholder { color: var(--ext-text-tertiary); }
    .sidebar__search-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      color: var(--ext-text-secondary);
      pointer-events: none;
    }
    .sidebar__nav { flex: 1; }
    .sidebar__nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 9px 16px;
      border: none;
      border-radius: 6px;
      background: transparent;
      color: var(--ext-text);
      cursor: pointer;
      font-size: 14px;
      line-height: 20px;
      text-align: left;
      transition: background 0.15s, color 0.15s;
    }
    .sidebar__nav-item:hover { background: var(--ext-sidebar-hover); }
    .sidebar__nav-item.active {
      background: var(--ext-sidebar-selected);
      color: var(--ext-sidebar-selected-text);
    }
    .sidebar__nav-item svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }
    .sidebar__store-link {
      display: block;
      padding: 12px 16px;
      color: var(--ext-link);
      font-size: 13px;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.15s;
    }
    .sidebar__store-link:hover {
      background: var(--ext-sidebar-hover);
    }
    .sidebar__dev-mode {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px;
      border-top: 1px solid var(--ext-border);
    }
    .sidebar__dev-mode-label {
      font-size: 13px;
      color: var(--ext-text);
      line-height: 20px;
    }

    /* Toggle switch */
    .toggle-switch {
      position: relative;
      width: 40px;
      height: 22px;
      display: inline-block;
      flex-shrink: 0;
    }
    .toggle-switch input { display: none; }
    .toggle-switch__slider {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: var(--ext-toggle-off);
      border-radius: 22px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .toggle-switch__slider::before {
      content: '';
      position: absolute;
      left: 3px;
      top: 3px;
      width: 16px;
      height: 16px;
      background: var(--ext-toggle-knob);
      border-radius: 50%;
      transition: transform 0.2s;
    }
    .toggle-switch input:checked + .toggle-switch__slider { background: var(--ext-toggle-on); }
    .toggle-switch input:checked + .toggle-switch__slider::before { transform: translateX(18px); }

    /* ==================== Main content ==================== */
    .main {
      flex: 1;
      min-width: 0;
      height: 100vh;
      overflow-y: auto;
      padding: 32px 40px;
    }
    .main__header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
    }
    .main__title {
      font-size: 22px;
      font-weight: 600;
      color: var(--ext-text);
      line-height: 30px;
    }
    .main__dev-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .btn-dev {
      display: inline-flex;
      align-items: center;
      height: 32px;
      padding: 0 14px;
      border: 1px solid var(--ext-dev-button-border);
      border-radius: 6px;
      background: var(--ext-dev-button-bg);
      color: var(--ext-dev-button-text);
      cursor: pointer;
      font-size: 13px;
      line-height: 20px;
      transition: background 0.15s, border-color 0.15s;
      white-space: nowrap;
    }
    .btn-dev:hover { background: var(--ext-dev-button-hover-bg); }
    .btn-dev:disabled { opacity: 0.5; cursor: default; }

    /* ==================== Status ==================== */
    .status-bar {
      padding: 10px 14px;
      border-radius: 6px;
      margin-bottom: 16px;
      font-size: 13px;
      line-height: 20px;
      background: rgba(52,168,83,0.12);
      border: 1px solid #34a853;
      color: #1e7e34;
    }
    [data-theme="dark"] .status-bar {
      background: rgba(52,168,83,0.12);
      border-color: #34a853;
      color: #81c995;
    }
    .status-bar--error {
      background: rgba(234,67,53,0.1) !important;
      border-color: #ea4335 !important;
      color: #c42b1c !important;
    }
    [data-theme="dark"] .status-bar--error {
      background: rgba(242,139,130,0.12) !important;
      border-color: #f28b82 !important;
      color: #f28b82 !important;
    }
    .status-bar[hidden] { display: none; }

    /* ==================== Group ==================== */
    .ext-group { margin-bottom: 32px; }
    .ext-group__title {
      font-size: 16px;
      font-weight: 600;
      color: var(--ext-group-title-color);
      padding-bottom: 12px;
      border-bottom: 1px solid var(--ext-border);
      margin-bottom: 16px;
    }

    /* ==================== Extension card ==================== */
    .ext-card {
      display: flex;
      flex-direction: column;
      padding: 16px;
      background: var(--ext-card-bg);
      border: 1px solid var(--ext-card-border);
      border-radius: 8px;
      margin-bottom: 12px;
      transition: box-shadow 0.15s;
    }
    .ext-card:hover { box-shadow: var(--ext-card-hover-shadow); }
    .ext-card.hidden { display: none; }
    .ext-card__top {
      display: flex;
      align-items: flex-start;
      gap: 14px;
    }
    .ext-card__icon {
      width: 44px;
      height: 44px;
      border-radius: 8px;
      background: var(--ext-sidebar-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
      overflow: hidden;
      border: 1px solid var(--ext-border);
    }
    .ext-card__icon img { width: 44px; height: 44px; object-fit: contain; }
    .ext-card__body { flex: 1; min-width: 0; }
    .ext-card__name-row {
      display: flex;
      align-items: baseline;
      gap: 6px;
      margin-bottom: 2px;
    }
    .ext-card__name {
      font-size: 15px;
      font-weight: 500;
      color: var(--ext-text);
      line-height: 22px;
    }
    .ext-card__version { color: var(--ext-text-tertiary); font-size: 12px; font-weight: 400; }
    .ext-card__desc {
      color: var(--ext-text-secondary);
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 4px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .ext-card__meta {
      color: var(--ext-text-tertiary);
      font-size: 11px;
      line-height: 1.6;
    }
    .ext-card__meta span { display: inline; }
    .ext-card__meta-tag {
      display: inline-block;
      padding: 0 6px;
      margin-right: 4px;
      border: 1px solid var(--ext-border);
      border-radius: 4px;
      background: var(--ext-sidebar-bg);
      font-size: 10px;
      color: var(--ext-text-secondary);
      vertical-align: middle;
    }
    .ext-card__actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    .ext-card__bottom {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--ext-border);
    }
    .btn-card {
      display: inline-flex;
      align-items: center;
      height: 30px;
      padding: 0 12px;
      border: 1px solid var(--ext-button-border);
      border-radius: 6px;
      background: var(--ext-button-bg);
      color: var(--ext-button-text);
      cursor: pointer;
      font-size: 12px;
      line-height: 18px;
      transition: background 0.15s, border-color 0.15s;
    }
    .btn-card:hover { background: var(--ext-button-hover-bg); }
    .btn-card--danger {
      color: var(--ext-danger);
      border-color: var(--ext-danger);
    }
    .btn-card--danger:hover { background: var(--ext-danger-hover); }

    /* ==================== Empty / placeholder ==================== */
    .empty-state {
      text-align: center;
      padding: 64px 20px;
      color: var(--ext-text-tertiary);
    }
    .empty-state__title {
      font-size: 15px;
      color: var(--ext-text-secondary);
      margin-top: 8px;
    }
    .empty-state__desc {
      font-size: 13px;
      color: var(--ext-text-tertiary);
      margin-top: 4px;
    }

    /* ==================== 扩展详情视图（二级界面） ==================== */
    .ext-detail { display: none; }
    .ext-detail__back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px 6px 6px;
      margin-bottom: 20px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--ext-accent);
      font-size: 13px;
      cursor: pointer;
    }
    .ext-detail__back:hover { background: var(--ext-sidebar-hover); }
    .ext-detail__head {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 20px;
      border: 1px solid var(--ext-card-border);
      border-radius: 12px;
      background: var(--ext-card-bg);
      margin-bottom: 16px;
    }
    .ext-detail__icon {
      width: 72px;
      height: 72px;
      flex-shrink: 0;
      border-radius: 12px;
      background: var(--ext-sidebar-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .ext-detail__icon img { width: 56px; height: 56px; object-fit: contain; }
    .ext-detail__icon--placeholder {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      font-size: 32px; color: var(--ext-text-secondary);
    }
    .ext-detail__head-info { flex: 1; min-width: 0; }
    .ext-detail__name {
      font-size: 20px;
      font-weight: 600;
      color: var(--ext-text);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .ext-detail__version { font-size: 13px; color: var(--ext-text-tertiary); font-weight: 400; }
    .ext-detail__source {
      display: inline-block;
      margin-top: 8px;
      padding: 2px 10px;
      border-radius: 10px;
      font-size: 11px;
      background: var(--ext-accent-light);
      color: var(--ext-accent);
    }
    .ext-detail__desc {
      margin-top: 8px;
      font-size: 13px;
      line-height: 20px;
      color: var(--ext-text-secondary);
    }
    .ext-detail__enable {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 20px;
      border: 1px solid var(--ext-card-border);
      border-radius: 12px;
      background: var(--ext-card-bg);
      margin-bottom: 16px;
    }
    .ext-detail__enable-label { flex: 1; }
    .ext-detail__enable-title { font-size: 14px; font-weight: 500; color: var(--ext-text); }
    .ext-detail__enable-sub { font-size: 12px; color: var(--ext-text-tertiary); margin-top: 2px; }
    .ext-detail__section {
      padding: 16px 20px;
      border: 1px solid var(--ext-card-border);
      border-radius: 12px;
      background: var(--ext-card-bg);
      margin-bottom: 16px;
    }
    .ext-detail__section-title {
      font-size: 14px;
      font-weight: 500;
      color: var(--ext-text);
      margin-bottom: 12px;
    }
    .ext-detail__perm {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 8px 0;
      font-size: 13px;
      color: var(--ext-text);
      border-bottom: 1px solid var(--ext-border);
    }
    .ext-detail__perm:last-child { border-bottom: 0; }
    .ext-detail__perm-icon { color: var(--ext-accent); flex-shrink: 0; margin-top: 2px; }
    .ext-detail__perm-name { flex: 1; }
    .ext-detail__perm-desc { color: var(--ext-text-tertiary); font-size: 12px; }
    .ext-detail__row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 0;
      border-bottom: 1px solid var(--ext-border);
      font-size: 13px;
    }
    .ext-detail__row:last-child { border-bottom: 0; }
    .ext-detail__row-label { color: var(--ext-text-secondary); flex-shrink: 0; }
    .ext-detail__row-value { color: var(--ext-text); word-break: break-all; text-align: right; display: flex; align-items: center; gap: 8px; min-width: 0; }
    .ext-detail__id-copy {
      display: inline-flex;
      align-items: center;
      padding: 3px 10px;
      border: 1px solid var(--ext-input-border);
      border-radius: 6px;
      background: var(--ext-input-bg);
      color: var(--ext-accent);
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
    }
    .ext-detail__id-copy:hover { background: var(--ext-sidebar-hover); }
    .ext-detail__open-site {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 30px;
      padding: 0 12px;
      border: 1px solid var(--ext-dev-button-border);
      border-radius: 6px;
      background: var(--ext-button-bg);
      color: var(--ext-accent);
      font-size: 12px;
      cursor: pointer;
      text-decoration: none;
      white-space: nowrap;
    }
    .ext-detail__open-site:hover { background: var(--ext-sidebar-hover); }
    .ext-detail__remove {
      display: inline-flex;
      align-items: center;
      height: 34px;
      padding: 0 16px;
      border: 1px solid var(--ext-danger);
      border-radius: 6px;
      background: transparent;
      color: var(--ext-danger);
      font-size: 13px;
      cursor: pointer;
      margin-top: 8px;
    }
    .ext-detail__remove:hover { background: var(--ext-danger-hover); }

    /* ==================== Keyboard shortcuts placeholder ==================== */
    .shortcuts-placeholder {
      padding: 40px;
      text-align: center;
      color: var(--ext-text-secondary);
      font-size: 14px;
    }

    /* ==================== Edge store top row (sidebar bottom) ==================== */
    .sidebar__bottom {
      padding: 12px 16px;
      border-top: 1px solid var(--ext-border);
    }
    .sidebar__bottom input {
      width: 100%;
      height: 30px;
      padding: 0 10px;
      border: 1px solid var(--ext-input-border);
      border-radius: 6px;
      background: var(--ext-input-bg);
      color: var(--ext-text);
      font-size: 12px;
      line-height: 18px;
      outline: none;
      margin-bottom: 6px;
      transition: border-color 0.15s;
    }
    .sidebar__bottom input:hover { border-color: var(--ext-text-secondary); }
    .sidebar__bottom input:focus { border-color: var(--ext-accent); box-shadow: 0 0 0 2px var(--ext-accent-light); }
    .sidebar__bottom input::placeholder { color: var(--ext-text-tertiary); }
    .sidebar__store-actions {
      display: flex;
      gap: 6px;
    }
    .btn-store {
      flex: 1;
      height: 28px;
      padding: 0 8px;
      border: 1px solid var(--ext-input-border);
      border-radius: 6px;
      background: var(--ext-input-bg);
      color: var(--ext-text);
      cursor: pointer;
      font-size: 11px;
      white-space: nowrap;
      transition: background 0.15s;
    }
    .btn-store:hover { background: var(--ext-sidebar-hover); }

    /* ==================== Responsive ==================== */
    @media (max-width: 768px) {
      .sidebar { width: 200px; min-width: 200px; }
      .main { padding: 24px 20px; }
      .main__header { flex-direction: column; align-items: flex-start; }
      .ext-card__top { flex-direction: column; }
      .ext-card__actions { width: 100%; justify-content: flex-end; }
    }
  </style>
</head>
<body>
  <!-- ==================== Left Sidebar ==================== -->
  <aside class="sidebar custom-scroll">
    <div class="sidebar__title">扩展</div>

    <div class="sidebar__search">
      <svg class="sidebar__search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="7"></circle>
        <path d="m21 21-4.35-4.35"></path>
      </svg>
      <input type="text" id="searchInput" placeholder="搜索已安装的扩展" />
    </div>

    <nav class="sidebar__nav">
      <button class="sidebar__nav-item active" data-view="my-extensions">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="3" width="9" height="9" rx="2"></rect>
          <rect x="13" y="3" width="9" height="9" rx="2"></rect>
          <rect x="2" y="14" width="9" height="9" rx="2"></rect>
          <rect x="13" y="14" width="9" height="9" rx="2"></rect>
        </svg>
        <span>我的扩展</span>
      </button>
      <button class="sidebar__nav-item" data-view="shortcuts">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="6" cy="12" r="4"></circle>
          <path d="M9.75 9.75 21 3"></path>
          <circle cx="18" cy="12" r="4"></circle>
          <path d="M14.56 16.68 3 21"></path>
        </svg>
        <span>键盘快捷方式</span>
      </button>
    </nav>

    <a class="sidebar__store-link" id="btnOpenEdgeStore" tabindex="0">
      获取 Microsoft Edge 扩展
    </a>

    <div class="sidebar__dev-mode">
      <span class="sidebar__dev-mode-label">开发人员模式</span>
      <label class="toggle-switch">
        <input type="checkbox" id="devModeToggle" />
        <span class="toggle-switch__slider"></span>
      </label>
    </div>

    <div class="sidebar__bottom">
      <input type="text" id="edgeStoreInput" placeholder="粘贴 Edge 扩展 ID 或链接" />
      <div class="sidebar__store-actions">
        <button class="btn-store" id="btnInstallFromEdge">从商店安装</button>
      </div>
    </div>
  </aside>

  <!-- ==================== Right Main Content ==================== -->
  <main class="main custom-scroll" id="mainContent">
    <!-- My Extensions View -->
    <div id="view-my-extensions">
      <div class="main__header">
        <h2 class="main__title">已安装的扩展</h2>
        <div class="main__dev-actions" id="devActions">
          <button class="btn-dev" id="btnInstallUnpacked">加载解压缩的扩展</button>
          <button class="btn-dev" id="btnInstallFile">打包扩展</button>
          <button class="btn-dev" id="btnUpdate">更新</button>
        </div>
      </div>

      <div id="status" class="status-bar" hidden></div>

      <div id="extensionsList">
        <div class="empty-state">
          <div class="empty-state__title">暂无已安装的扩展程序</div>
          <div class="empty-state__desc">从 Microsoft Edge 扩展应用商店或本地加载扩展以开始使用</div>
        </div>
      </div>

      <!-- 扩展详情（二级界面） -->
      <div id="extDetail" class="ext-detail">
        <button class="ext-detail__back" id="extDetailBack">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
          返回
        </button>
        <div id="extDetailContent"></div>
      </div>
    </div>

    <!-- Keyboard Shortcuts View -->
    <div id="view-shortcuts" style="display:none;">
      <div class="main__header">
        <h2 class="main__title">键盘快捷方式</h2>
      </div>
      <div class="shortcuts-placeholder">暂无已配置的键盘快捷方式</div>
    </div>
  </main>

  <script>
    const api = window.NeutronBrowser || {};

    // DOM refs
    const searchInput = document.getElementById('searchInput');
    const devModeToggle = document.getElementById('devModeToggle');
    const devActions = document.getElementById('devActions');
    const extensionsList = document.getElementById('extensionsList');
    const statusEl = document.getElementById('status');
    const viewMyExtensions = document.getElementById('view-my-extensions');
    const viewShortcuts = document.getElementById('view-shortcuts');
    const extDetail = document.getElementById('extDetail');
    const extDetailContent = document.getElementById('extDetailContent');
    const extDetailBack = document.getElementById('extDetailBack');

    const btnInstallFile = document.getElementById('btnInstallFile');
    const btnInstallUnpacked = document.getElementById('btnInstallUnpacked');
    const btnUpdate = document.getElementById('btnUpdate');
    const btnOpenEdgeStore = document.getElementById('btnOpenEdgeStore');
    const btnInstallFromEdge = document.getElementById('btnInstallFromEdge');
    const edgeStoreInput = document.getElementById('edgeStoreInput');

    // ==================== Theme ====================
    async function applyTheme() {
      const theme = await api.getTheme();
      const resolved = theme === 'system'
        ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        : (theme || 'light');
      document.documentElement.setAttribute('data-theme', resolved);
    }
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', async () => {
      const theme = await api.getTheme();
      if (theme === 'system') {
        const resolved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', resolved);
      }
    });

    // ==================== Navigation ====================
    document.querySelectorAll('.sidebar__nav-item').forEach(item => {
      item.addEventListener('click', () => {
        document.querySelectorAll('.sidebar__nav-item').forEach(el => el.classList.remove('active'));
        item.classList.add('active');
        const view = item.dataset.view;
        hideExtensionDetail();
        viewMyExtensions.style.display = view === 'my-extensions' ? '' : 'none';
        viewShortcuts.style.display = view === 'shortcuts' ? '' : 'none';
      });
    });

    // ==================== Dev mode toggle ====================
    devModeToggle.addEventListener('change', () => {
      devActions.style.display = devModeToggle.checked ? '' : 'none';
      loadExtensions();
    });

    // ==================== Search filter ====================
    searchInput.addEventListener('input', () => {
      const query = searchInput.value.toLowerCase().trim();
      document.querySelectorAll('.ext-card').forEach(card => {
        const name = (card.dataset.extName || '').toLowerCase();
        const desc = (card.dataset.extDesc || '').toLowerCase();
        card.classList.toggle('hidden', query !== '' && !name.includes(query) && !desc.includes(query));
      });
    });

    // ==================== Helpers ====================
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text || '';
      return div.innerHTML;
    }

    function showStatus(message, isError) {
      statusEl.hidden = false;
      statusEl.textContent = message;
      statusEl.className = 'status-bar' + (isError ? ' status-bar--error' : '');
      clearTimeout(showStatus.timer);
      showStatus.timer = setTimeout(() => { statusEl.hidden = true; }, 5000);
    }

    function setBusy(busy) {
      btnInstallFile.disabled = busy;
      btnInstallUnpacked.disabled = busy;
      btnUpdate.disabled = busy;
      btnInstallFromEdge.disabled = busy;
      edgeStoreInput.disabled = busy;
    }

    // ==================== Render extensions ====================
    function renderExtensions(extensions) {
      if (!extensions || extensions.length === 0) {
        extensionsList.innerHTML = `<div class="empty-state">
          <div class="empty-state__title">暂无已安装的扩展程序</div>
          <div class="empty-state__desc">从 Microsoft Edge 扩展应用商店或本地加载扩展以开始使用</div>
        </div>`;
        return;
      }

      const hasDevMode = devModeToggle.checked;

      // Group by source
      const storeExts = extensions.filter(e => e.source && e.source !== 'local');
      const localExts = extensions.filter(e => !e.source || e.source === 'local');

      let html = '';

      if (storeExts.length > 0) {
        html += `<div class="ext-group">
          <div class="ext-group__title">来自 Microsoft Edge 扩展应用商店</div>`;
        storeExts.forEach(ext => { html += buildCard(ext, hasDevMode); });
        html += `</div>`;
      }

      if (localExts.length > 0) {
        html += `<div class="ext-group">
          <div class="ext-group__title">来自其他来源</div>`;
        localExts.forEach(ext => { html += buildCard(ext, hasDevMode); });
        html += `</div>`;
      }

      extensionsList.innerHTML = html;

      // 卡片点击 → 打开详情（点击按钮/开关不触发）
      extensionsList.querySelectorAll('.ext-card').forEach(card => {
        card.style.cursor = 'pointer';
        card.addEventListener('click', (e) => {
          if (e.target.closest('button') || e.target.closest('.toggle-switch')) return;
          const ext = (extensions || []).find(x => x.id === card.dataset.extId);
          if (ext) showExtensionDetail(ext);
        });
      });

      // Attach toggle listeners
      extensionsList.querySelectorAll('.ext-toggle').forEach(toggle => {
        toggle.addEventListener('change', async () => {
          const extId = toggle.dataset.extId;
          const result = await api.toggleExtension(extId);
          if (!result.success) {
            toggle.checked = !toggle.checked;
            showStatus(result.message || '切换失败', true);
          }
          loadExtensions();
        });
      });

      // Attach delete button listeners
      extensionsList.querySelectorAll('.btn-delete').forEach(btn => {
        btn.addEventListener('click', async () => {
          const extId = btn.dataset.extId;
          const extName = btn.dataset.extName;
          if (!confirm(`确定要删除「${extName}」吗？`)) return;
          const result = await api.uninstallExtension(extId);
          showStatus(result.success ? '已删除' : result.message || '删除失败', !result.success);
          loadExtensions();
        });
      });

      // Attach details button listeners
      extensionsList.querySelectorAll('.btn-details').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const ext = (extensions || []).find(x => x.id === btn.dataset.extId);
          if (ext) showExtensionDetail(ext);
        });
      });

      // 检查视图：打开扩展后台页 DevTools（对齐 Edge，开发模式下显示）
      extensionsList.querySelectorAll('.btn-inspect').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          if (api.inspectExtensionView) api.inspectExtensionView(btn.dataset.extId);
        });
      });
    }

    function buildCard(ext, hasDevMode) {
      const iconHtml = ext.icon
        ? `<img src="file:///${(ext.icon || '').replace(/\\/g, '/')}" alt="" />`
        : '';
      const viewInfo = ext.viewInfo || '';
      const viewInfoLabel = ext.backgroundType === 'service_worker' ? 'Service worker' : '';

      let metaLines = [];
      if (hasDevMode && ext.id) {
        metaLines.push(`<span>ID: ${escapeHtml(ext.id)}</span>`);
      }
      if (hasDevMode && viewInfo) {
        const label = viewInfoLabel ? `<span class="ext-card__meta-tag">${escapeHtml(viewInfoLabel)}</span>` : '';
        metaLines.push(`<span>检查视图: ${label} ${escapeHtml(viewInfo)}</span>`);
      }

      const metaHtml = metaLines.length > 0
        ? `<div class="ext-card__meta">${metaLines.join('<br>')}</div>`
        : '';

      return `<div class="ext-card" data-ext-id="${escapeHtml(ext.id)}" data-ext-name="${escapeHtml(ext.name)}" data-ext-desc="${escapeHtml(ext.description || '')}">
        <div class="ext-card__top">
          <div class="ext-card__icon">${iconHtml}</div>
          <div class="ext-card__body">
            <div class="ext-card__name-row">
              <span class="ext-card__name">${escapeHtml(ext.name)}</span>
              <span class="ext-card__version">v${escapeHtml(ext.version || '')}</span>
            </div>
            <div class="ext-card__desc">${escapeHtml(ext.description || '暂无描述')}</div>
            ${metaHtml}
          </div>
          <div class="ext-card__actions">
            <label class="toggle-switch">
              <input type="checkbox" class="ext-toggle" data-ext-id="${escapeHtml(ext.id)}" ${ext.enabled ? 'checked' : ''} />
              <span class="toggle-switch__slider"></span>
            </label>
          </div>
        </div>
        <div class="ext-card__bottom">
          <button class="btn-card btn-details" data-ext-id="${escapeHtml(ext.id)}" data-ext-name="${escapeHtml(ext.name)}">详细信息</button>
          ${hasDevMode ? `<button class="btn-card btn-inspect" data-ext-id="${escapeHtml(ext.id)}" title="打开扩展后台页 DevTools">检查视图</button>` : ''}
          <button class="btn-card btn-card--danger btn-delete" data-ext-id="${escapeHtml(ext.id)}" data-ext-name="${escapeHtml(ext.name)}">删除</button>
        </div>
      </div>`;
    }

    // ==================== 扩展详情（二级界面） ====================
    const PERMISSION_LABELS = {
      tabs: ['读取浏览记录', '读取您访问过的网站标签页'],
      activeTab: ['访问当前标签页', '在您当前访问的网站上读取和更改数据'],
      storage: ['存储数据', '存储和读取扩展的本地数据'],
      cookies: ['读取和更改 Cookie', '管理您的 Cookie 数据'],
      history: ['读取浏览历史', '访问您的浏览历史记录'],
      bookmarks: ['读取和更改书签', '管理您的书签'],
      downloads: ['管理下载', '读取和管理您的下载'],
      notifications: ['显示通知', '向您显示通知'],
      webRequest: ['拦截网络请求', '读取和修改浏览器发出的网络请求'],
      webNavigation: ['读取导航记录', '跟踪您在网页之间的导航'],
      clipboardRead: ['读取剪贴板', '读取您剪贴板中的内容'],
      clipboardWrite: ['写入剪贴板', '向剪贴板写入内容'],
      geolocation: ['读取位置', '访问您的位置信息'],
      alarms: ['定时提醒', '使用计时器在后台执行任务'],
      contextMenus: ['显示右键菜单', '在右键菜单中添加项目'],
      scripting: ['读取和更改网页内容', '在网页上注入脚本'],
      management: ['管理扩展', '管理其他已安装的扩展'],
    };
    const PERMISSION_DEFAULT = ['扩展权限', '读取和更改您的数据'];

    function formatBytes(bytes) {
      const value = Number(bytes) || 0;
      if (value <= 0) return '未知';
      const k = 1024;
      const sizes = ['B', 'KB', 'MB', 'GB'];
      const i = Math.min(sizes.length - 1, Math.floor(Math.log(value) / Math.log(k)));
      return parseFloat((value / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
    }

    function sourceLabel(ext) {
      const src = ext.source || ext.installSource;
      return src === 'edge_store' ? 'Microsoft Edge 扩展应用商店' : '本地加载';
    }

    function buildPermissionRows(ext) {
      const rows = [];
      const perms = Array.isArray(ext.permissions) ? ext.permissions : [];
      const hosts = Array.isArray(ext.hostPermissions) ? ext.hostPermissions : [];

      // 站点访问
      hosts.forEach((h) => {
        const label = h === '<all_urls>' ? '在所有网站上' : (h.endsWith('/*') ? h.slice(0, -2) : h);
        rows.push({
          name: label,
          desc: h === '<all_urls>' ? '在您访问的所有网站上读取和更改数据' : '在该网站上读取和更改数据',
        });
      });

      // 权限
      perms.forEach((p) => {
        const info = PERMISSION_LABELS[p] || PERMISSION_DEFAULT;
        rows.push({ name: info[0], desc: info[1] });
      });

      return rows;
    }

    function showExtensionDetail(ext) {
      if (!ext) return;
      const rows = buildPermissionRows(ext);
      const permHtml = rows.length > 0
        ? rows.map((r) => `
          <div class="ext-detail__perm">
            <span class="ext-detail__perm-icon">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            </span>
            <div>
              <div class="ext-detail__perm-name">${escapeHtml(r.name)}</div>
              <div class="ext-detail__perm-desc">${escapeHtml(r.desc)}</div>
            </div>
          </div>`).join('')
        : '<div class="ext-detail__perm-desc" style="padding:4px 0">该扩展不需要额外的权限</div>';

      const iconHtml = ext.icon
        ? `<img src="file:///${(ext.icon || '').replace(/\\/g, '/')}" alt="" />`
        : '<div class="ext-detail__icon--placeholder">🧩</div>';

      const source = sourceLabel(ext);
      const homepageUrl = ext.homepageUrl || '';
      const isDev = devModeToggle.checked;

      extDetailContent.innerHTML = `
        <div class="ext-detail__head">
          <div class="ext-detail__icon">${iconHtml}</div>
          <div class="ext-detail__head-info">
            <div class="ext-detail__name">
              ${escapeHtml(ext.name)}
              <span class="ext-detail__version">v${escapeHtml(ext.version || '')}</span>
            </div>
            <span class="ext-detail__source">${escapeHtml(source)}</span>
            <div class="ext-detail__desc">${escapeHtml(ext.description || '暂无描述')}</div>
          </div>
        </div>

        <div class="ext-detail__enable">
          <div class="ext-detail__enable-label">
            <div class="ext-detail__enable-title">${ext.enabled ? '已启用' : '已禁用'}</div>
            <div class="ext-detail__enable-sub">启用后此扩展可读取和更改您的数据</div>
          </div>
          <label class="toggle-switch">
            <input type="checkbox" id="extDetailToggle" ${ext.enabled ? 'checked' : ''} />
            <span class="toggle-switch__slider"></span>
          </label>
        </div>

        <div class="ext-detail__section">
          <div class="ext-detail__section-title">权限</div>
          ${permHtml}
        </div>

        <div class="ext-detail__section">
          <div class="ext-detail__section-title">详细信息</div>
          <div class="ext-detail__row">
            <span class="ext-detail__row-label">来源</span>
            <span class="ext-detail__row-value">${escapeHtml(source)}</span>
          </div>
          <div class="ext-detail__row">
            <span class="ext-detail__row-label">扩展 ID</span>
            <span class="ext-detail__row-value">
              <span style="max-width:280px;overflow:hidden;text-overflow:ellipsis">${escapeHtml(ext.id || '')}</span>
              <button class="ext-detail__id-copy" id="extCopyId">复制</button>
            </span>
          </div>
          ${ext.size ? `<div class="ext-detail__row"><span class="ext-detail__row-label">大小</span><span class="ext-detail__row-value">${escapeHtml(formatBytes(ext.size))}</span></div>` : ''}
          ${isDev && ext.backgroundType ? `<div class="ext-detail__row"><span class="ext-detail__row-label">后台类型</span><span class="ext-detail__row-value">${escapeHtml(ext.backgroundType === 'service_worker' ? 'Service Worker' : '后台页面')}</span></div>` : ''}
          ${isDev && ext.path ? `<div class="ext-detail__row"><span class="ext-detail__row-label">路径</span><span class="ext-detail__row-value" style="font-size:12px">${escapeHtml(ext.path)}</span></div>` : ''}
          ${isDev ? `<div class="ext-detail__row"><span class="ext-detail__row-label">检查视图</span><span class="ext-detail__row-value"><button class="ext-detail__id-copy" id="extInspectView">打开 DevTools</button></span></div>` : ''}
        </div>

        <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
          ${homepageUrl ? `<a class="ext-detail__open-site" id="extOpenSite" href="#">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
            打开网站</a>` : ''}
          ${ext.optionsUrl ? `<button class="ext-detail__open-site" id="extOpenOptions">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            扩展选项</button>` : ''}
          <button class="ext-detail__remove" id="extRemove">移除</button>
        </div>
      `;

      // 切换视图：隐藏列表，显示详情
      const header = viewMyExtensions.querySelector('.main__header');
      if (header) header.style.display = 'none';
      statusEl.hidden = true;
      extensionsList.style.display = 'none';
      extDetail.style.display = 'block';

      // 绑定事件
      document.getElementById('extDetailToggle').addEventListener('change', async (e) => {
        const result = await api.toggleExtension(ext.id);
        if (!result.success) {
          e.target.checked = !e.target.checked;
          showStatus(result.message || '切换失败', true);
        }
        const updated = await api.getExtensions();
        const found = (updated || []).find(x => x.id === ext.id);
        if (found) showExtensionDetail(found);
        else hideExtensionDetail();
      });

      const copyBtn = document.getElementById('extCopyId');
      if (copyBtn) copyBtn.addEventListener('click', async () => {
        await api.copyText(ext.id || '');
        copyBtn.textContent = '已复制';
        setTimeout(() => { copyBtn.textContent = '复制'; }, 1500);
      });

      const inspectBtn = document.getElementById('extInspectView');
      if (inspectBtn) inspectBtn.addEventListener('click', () => {
        if (api.inspectExtensionView) api.inspectExtensionView(ext.id);
      });

      const openSite = document.getElementById('extOpenSite');
      if (openSite) openSite.addEventListener('click', (e) => {
        e.preventDefault();
        api.createTab(homepageUrl);
      });

      const openOptions = document.getElementById('extOpenOptions');
      if (openOptions) openOptions.addEventListener('click', () => {
        const optionsPath = String(ext.optionsUrl || '').replace(/^\/+/, '');
        api.createTab(`chrome-extension://${ext.id}/${optionsPath}`);
      });

      document.getElementById('extRemove').addEventListener('click', async () => {
        if (!confirm(`确定要移除「${ext.name}」吗？`)) return;
        const result = await api.uninstallExtension(ext.id);
        showStatus(result.success ? '已移除' : result.message || '移除失败', !result.success);
        hideExtensionDetail();
        loadExtensions();
      });
    }

    function hideExtensionDetail() {
      extDetail.style.display = 'none';
      const header = viewMyExtensions.querySelector('.main__header');
      if (header) header.style.display = '';
      extensionsList.style.display = '';
    }

    // 返回按钮
    extDetailBack.addEventListener('click', hideExtensionDetail);

    // ==================== Load extensions ====================
    async function loadExtensions() {
      const extensions = await api.getExtensions();
      renderExtensions(extensions || []);
    }

    // ==================== Event bindings ====================
    btnInstallFile.addEventListener('click', async () => {
      setBusy(true);
      const result = await api.installExtension();
      setBusy(false);
      showStatus(result.success ? `已安装 ${result.extension.name}` : result.message || '安装失败', !result.success);
      loadExtensions();
    });

    btnInstallUnpacked.addEventListener('click', async () => {
      setBusy(true);
      const result = await api.installUnpackedExtension();
      setBusy(false);
      showStatus(result.success ? `已加载 ${result.extension.name}` : result.message || '加载失败', !result.success);
      loadExtensions();
    });

    btnUpdate.addEventListener('click', () => {
      loadExtensions();
      showStatus('已刷新扩展列表', false);
    });

    btnOpenEdgeStore.addEventListener('click', (e) => {
      e.preventDefault();
      api.createTab('https://microsoftedge.microsoft.com/addons');
    });

    btnInstallFromEdge.addEventListener('click', async () => {
      const input = edgeStoreInput.value.trim();
      if (!input) {
        showStatus('请粘贴 Edge 扩展链接或 32 位扩展 ID', true);
        return;
      }
      setBusy(true);
      const result = await api.installFromEdgeStore(input);
      setBusy(false);
      showStatus(result.success ? `已安装 ${result.extension.name}` : result.message || '安装失败', !result.success);
      if (result.success) edgeStoreInput.value = '';
      loadExtensions();
    });

    // ==================== Init ====================
    applyTheme();
    devActions.style.display = devModeToggle.checked ? '' : 'none';
    loadExtensions();
  </script>
</body>
</html>
