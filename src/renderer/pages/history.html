<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>历史记录</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      font-size: 14px;
      background: #202124;
      color: #e8eaed;
      height: 100vh;
      overflow-y: auto;
    }
    .page { max-width: 800px; margin: 0 auto; padding: 40px 24px; }
    h1 { font-size: 24px; font-weight: 400; margin-bottom: 24px; color: #ffffff; }
    .search-box { position: relative; margin-bottom: 24px; }
    .search-box input {
      width: 100%; padding: 10px 16px 10px 40px;
      border: 1px solid #3c4043; border-radius: 24px;
      background: #303134; color: #e8eaed; font-size: 14px; outline: none;
      transition: border-color 0.2s;
    }
    .search-box input:focus { border-color: #8ab4f8; }
    .search-box input::placeholder { color: #80868b; }
    .search-box__icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #80868b; }
    .list-item {
      display: flex; align-items: center; gap: 12px; padding: 10px 16px;
      border-radius: 8px; cursor: pointer; transition: background 0.15s;
    }
    .list-item:hover { background: rgba(255,255,255,0.06); }
    .list-item__icon {
      width: 32px; height: 32px; border-radius: 50%; background: #3c4043;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
      color: #9aa0a6; font-size: 14px;
    }
    .list-item__content { flex: 1; min-width: 0; }
    .list-item__title { font-size: 13px; color: #e8eaed; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .list-item__subtitle { font-size: 11px; color: #80868b; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .list-item__time { font-size: 11px; color: #5f6368; flex-shrink: 0; }
    .list-item__delete {
      width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
      color: #5f6368; cursor: pointer; opacity: 0; transition: opacity 0.15s, background 0.15s;
      font-size: 16px; flex-shrink: 0; background: none; border: none;
    }
    .list-item:hover .list-item__delete { opacity: 1; }
    .list-item__delete:hover { background: rgba(255,255,255,0.1); color: #f28b82; }
    .date-header { font-size: 12px; font-weight: 600; color: #9aa0a6; padding: 16px 16px 8px; border-bottom: 1px solid #3c4043; margin-bottom: 4px; }
    .empty { text-align: center; padding: 64px 20px; color: #5f6368; }
    .empty__icon { font-size: 48px; margin-bottom: 12px; opacity: 0.4; }
    .actions { display: flex; justify-content: flex-end; margin-bottom: 16px; }
    .actions button {
      padding: 8px 16px; border-radius: 4px; border: 1px solid #5f6368;
      background: transparent; color: #f28b82; cursor: pointer; font-size: 13px;
      transition: background 0.15s;
    }
    .actions button:hover { background: rgba(242,139,130,0.1); }
  </style>
</head>
<body>
  <div class="page">
    <h1>📋 历史记录</h1>

    <div class="search-box">
      <span class="search-box__icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </span>
      <input type="text" id="searchInput" placeholder="搜索历史记录" />
    </div>

    <div class="actions">
      <button id="btnClearAll">清除所有历史记录</button>
    </div>

    <div id="historyList">
      <div class="empty">
        <div class="empty__icon">🕐</div>
        <div>加载中...</div>
      </div>
    </div>
  </div>

  <script>
    const api = window.NeutronBrowser || {};

    const searchInput = document.getElementById('searchInput');
    const historyList = document.getElementById('historyList');
    const btnClearAll = document.getElementById('btnClearAll');

    let allHistory = [];

    async function loadHistory() {
      allHistory = await api.getHistory();
      renderHistory(allHistory);
    }

    function renderHistory(items) {
      if (!items || items.length === 0) {
        historyList.innerHTML = `<div class="empty"><div class="empty__icon">🕐</div><div>没有历史记录</div></div>`;
        return;
      }

      // 按日期分组
      const grouped = {};
      items.forEach(item => {
        const date = new Date(item.lastVisitTime);
        const dateKey = date.toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric' });
        if (!grouped[dateKey]) grouped[dateKey] = [];
        grouped[dateKey].push(item);
      });

      let html = '';
      for (const [date, visits] of Object.entries(grouped)) {
        html += `<div class="date-header">${date}</div>`;
        visits.forEach(visit => {
          const time = new Date(visit.lastVisitTime).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
          html += `
            <div class="list-item" data-url="${visit.url}">
              <div class="list-item__icon">🌐</div>
              <div class="list-item__content">
                <div class="list-item__title">${escapeHtml(visit.title || visit.url)}</div>
                <div class="list-item__subtitle">${escapeHtml(visit.url)} - 访问 ${visit.visitCount || 1} 次</div>
              </div>
              <span class="list-item__time">${time}</span>
              <button class="list-item__delete" data-id="${visit.id}" title="删除">×</button>
            </div>
          `;
        });
      }
      historyList.innerHTML = html;

      // 绑定点击事件
      historyList.querySelectorAll('.list-item').forEach(el => {
        el.addEventListener('click', (e) => {
          if (e.target.classList.contains('list-item__delete')) return;
          const url = el.dataset.url;
          if (url && api.navigateTo) {
            api.navigateTo(url);
          }
        });
      });

      // 绑定删除按钮
      historyList.querySelectorAll('.list-item__delete').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          e.stopPropagation();
          const id = btn.dataset.id;
          await api.deleteHistoryItem(id);
          loadHistory();
        });
      });
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    searchInput.addEventListener('input', async () => {
      const query = searchInput.value.trim();
      if (query) {
        const results = await api.searchHistory(query);
        renderHistory(results);
      } else {
        renderHistory(allHistory);
      }
    });

    btnClearAll.addEventListener('click', async () => {
      if (confirm('确定要清除所有历史记录吗？此操作无法撤销。')) {
        await api.clearHistory();
        loadHistory();
      }
    });

    loadHistory();
  </script>
</body>
</html>
