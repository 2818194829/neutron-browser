<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>下载内容</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #ffffff;
      --panel: #f5f5f5;
      --border: #e3e3e3;
      --text: #202124;
      --muted: #666666;
      --hover: rgba(0, 0, 0, 0.055);
      --accent: #0067c0;
      --accent-soft: rgba(0, 103, 192, 0.16);
      --danger: #c42b1c;
      --danger-soft: rgba(196, 43, 28, 0.1);
      --success: #188038;
      --success-soft: rgba(24, 128, 56, 0.14);
      --track: #e8eaed;
      /* 文件类型图标配色（浅色） */
      --dl-icon-exe: #5f6368;
      --dl-icon-archive: #e8a33d;
      --dl-icon-text: #4285f4;
      --dl-icon-word: #1a73e8;
      --dl-icon-excel: #34a853;
      --dl-icon-ppt: #e8710a;
      --dl-icon-pdf: #d93025;
      --dl-icon-image: #9334e6;
      --dl-icon-video: #00897b;
      --dl-icon-audio: #d01884;
      --dl-icon-code: #1a73e8;
      --dl-icon-disk: #5f6368;
      --dl-icon-file: #5f6368;
    }
    [data-theme="dark"] {
      --bg: #1e1e26;
      --panel: #26262e;
      --border: #3b3b45;
      --text: #f3f3f3;
      --muted: #aaaaaa;
      --hover: rgba(255, 255, 255, 0.07);
      --accent: #70b5ff;
      --accent-soft: rgba(112, 181, 255, 0.18);
      --danger: #ff8a80;
      --danger-soft: rgba(255, 138, 128, 0.12);
      --success: #81c995;
      --success-soft: rgba(129, 201, 149, 0.16);
      --track: #3b3b45;
      /* 文件类型图标配色（深色） */
      --dl-icon-exe: #9aa0a6;
      --dl-icon-archive: #f0b54f;
      --dl-icon-text: #8ab4f8;
      --dl-icon-word: #8ab4f8;
      --dl-icon-excel: #81c995;
      --dl-icon-ppt: #f7b87a;
      --dl-icon-pdf: #f28b82;
      --dl-icon-image: #c58af9;
      --dl-icon-video: #80cbc4;
      --dl-icon-audio: #f48fb1;
      --dl-icon-code: #8ab4f8;
      --dl-icon-disk: #9aa0a6;
      --dl-icon-file: #9aa0a6;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      font-size: 14px;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      transition: background 0.2s, color 0.2s;
    }
    .page { max-width: 900px; margin: 0 auto; padding: 32px 24px 48px; }

    /* 页头 */
    .page-header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .page-header h1 { font-size: 22px; font-weight: 600; flex: 1; }
    .search-box {
      display: flex; align-items: center; gap: 6px;
      height: 34px; padding: 0 12px;
      border: 1px solid var(--border); border-radius: 6px;
      background: var(--panel); color: var(--muted);
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .search-box:focus-within { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
    .search-box input {
      border: 0; outline: 0; background: transparent; color: var(--text);
      font-size: 13px; width: 170px;
    }
    .search-box input::placeholder { color: var(--muted); }
    .header-btn {
      height: 34px; padding: 0 14px;
      border: 1px solid var(--border); border-radius: 6px;
      background: var(--panel); color: var(--text);
      font-size: 13px; cursor: pointer;
      transition: background 0.15s;
    }
    .header-btn:hover { background: var(--hover); }

    /* 分类页签 */
    .filter-tabs { display: flex; gap: 2px; margin-top: 24px; border-bottom: 1px solid var(--border); }
    .filter-tab {
      padding: 8px 16px; border: 0; background: transparent;
      color: var(--muted); font-size: 13px; cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: color 0.15s, border-color 0.15s;
    }
    .filter-tab:hover { color: var(--text); }
    .filter-tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 500; }

    /* 列表项 */
    .list-item {
      display: flex; align-items: center; gap: 14px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      transition: background 0.15s;
    }
    .list-item:hover { background: var(--hover); }
    .list-item__icon {
      width: 20px; height: 20px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
    }
    /* 文件类型图标：类型类控制颜色，随主题明暗适配 */
    .dl-icon { color: var(--dl-icon-file); }
    .dl-icon--exe { color: var(--dl-icon-exe); }
    .dl-icon--archive { color: var(--dl-icon-archive); }
    .dl-icon--text { color: var(--dl-icon-text); }
    .dl-icon--word { color: var(--dl-icon-word); }
    .dl-icon--excel { color: var(--dl-icon-excel); }
    .dl-icon--ppt { color: var(--dl-icon-ppt); }
    .dl-icon--pdf { color: var(--dl-icon-pdf); }
    .dl-icon--image { color: var(--dl-icon-image); }
    .dl-icon--video { color: var(--dl-icon-video); }
    .dl-icon--audio { color: var(--dl-icon-audio); }
    .dl-icon--code { color: var(--dl-icon-code); }
    .dl-icon--disk { color: var(--dl-icon-disk); }
    /* 弱化状态（已取消/已删除）：图标透明度降至 40% */
    .list-item--inactive .dl-icon { opacity: 0.4; }
    .list-item--inactive .list-item__title { color: var(--muted); }
    .list-item__content { flex: 1; min-width: 0; }
    .list-item__title-row { display: flex; align-items: center; gap: 8px; }
    .list-item__title {
      font-size: 13px; color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .list-item__title--danger { color: var(--danger); }
    .list-item__subtitle { font-size: 11px; color: var(--muted); margin-top: 3px; }
    .list-item__progress {
      width: 100%; height: 4px; background: var(--track);
      border-radius: 2px; margin-top: 8px; overflow: hidden;
    }
    .list-item__progress-bar {
      height: 100%; background: var(--accent);
      border-radius: 2px; transition: width 0.3s;
    }
    .list-item__progress-bar--paused { background: var(--muted); }
    .list-item__status {
      flex-shrink: 0; padding: 2px 10px; border-radius: 12px;
      font-size: 11px; margin-left: 8px;
    }
    .status--done { background: var(--success-soft); color: var(--success); }
    .status--failed { background: var(--danger-soft); color: var(--danger); }
    .status--progress { background: var(--accent-soft); color: var(--accent); }
    .status--muted { background: var(--hover); color: var(--muted); }
    .list-item__actions {
      display: flex; gap: 2px; flex-shrink: 0;
    }
    .list-item__real-icon { width: 20px; height: 20px; object-fit: contain; }
    .action-btn {
      width: 30px; height: 30px; border: 0; border-radius: 6px;
      background: transparent; color: var(--muted);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: background 0.15s, color 0.15s;
    }
    .action-btn:hover { background: var(--hover); color: var(--text); }
    .action-btn--danger:hover { color: var(--danger); }
    .action-btn--accent { color: var(--accent); }
    .action-btn--accent:hover { color: var(--accent); }
    .text-btn {
      height: 30px; padding: 0 10px; border: 0; border-radius: 6px;
      background: transparent; color: var(--accent); font-size: 12px;
      cursor: pointer; white-space: nowrap;
    }
    .text-btn:hover { background: var(--hover); text-decoration: underline; }

    /* 空状态 */
    .empty { text-align: center; padding: 72px 20px; color: var(--muted); }
    .empty__icon { font-size: 44px; margin-bottom: 12px; opacity: 0.5; }
    .empty__text { font-size: 14px; }

    /* 右键菜单 */
    .ctx-menu {
      position: fixed;
      z-index: 1000;
      min-width: 172px;
      padding: 6px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.16);
    }
    .ctx-menu__item {
      display: block;
      width: 100%;
      padding: 8px 12px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--text);
      font-size: 13px;
      text-align: left;
      cursor: pointer;
    }
    .ctx-menu__item:hover { background: var(--hover); }
    .ctx-menu__item--danger { color: var(--danger); }

    /* 轻量 Toast 提示 */
    .dl-toast {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      padding: 10px 20px;
      border-radius: 8px;
      background: #323232;
      color: #fff;
      font-size: 13px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
      max-width: 70vw;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .dl-toast--error { background: #c42b1c; }
    .dl-toast[hidden] { display: none; }
  </style>
</head>
<body>
  <div id="dlToast" class="dl-toast" hidden></div>
  <div class="page">
    <div class="page-header">
      <h1>下载内容</h1>
      <div class="search-box">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="search" id="searchInput" placeholder="搜索下载内容" spellcheck="false">
      </div>
      <button class="header-btn" id="btnClear">清空列表</button>
    </div>

    <div class="filter-tabs" id="filterTabs">
      <button class="filter-tab active" data-filter="all">全部</button>
      <button class="filter-tab" data-filter="completed">已完成</button>
      <button class="filter-tab" data-filter="cancelled">已取消</button>
      <button class="filter-tab" data-filter="failed">失败</button>
    </div>

    <div id="downloadList"></div>
  </div>

  <div id="ctxMenu" class="ctx-menu" style="display:none"></div>

  <script>
    const api = window.NeutronBrowser || {};

    // 轻量 Toast 提示
    function showToast(message, type) {
      const toast = document.getElementById('dlToast');
      if (!toast) return;
      toast.textContent = message;
      toast.className = 'dl-toast' + (type ? ' dl-toast--' + type : '');
      toast.hidden = false;
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => { toast.hidden = true; }, 3500);
    }

    // 主题跟随系统
    function applySystemTheme() {
      const dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    }
    applySystemTheme();
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applySystemTheme);

    const state = { filter: 'all', query: '' };
    let downloads = [];

    // 操作按钮 SVG
    const ACTION_ICONS = {
      pause: '<path d="M6 4h4v16H6z"/><path d="M14 4h4v16h-4z"/>',
      play: '<polygon points="6 4 20 12 6 20 6 4"/>',
      cancel: '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
      open: '<path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>',
      folder: '<path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>',
      link: '<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>',
      restart: '<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>',
      trash: '<polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/>',
    };

    // ==================== 文件类型图标（可配置映射，与主窗口一致） ====================
    // 后缀 → 类型组（新增后缀只需在这里加一行）
    const FILE_ICON_EXT_TYPES = {
      exe: 'exe', msi: 'exe', bat: 'exe', cmd: 'exe',
      zip: 'archive', rar: 'archive', '7z': 'archive', tar: 'archive', gz: 'archive',
      txt: 'text', log: 'text', md: 'text',
      doc: 'word', docx: 'word',
      xls: 'excel', xlsx: 'excel', csv: 'excel',
      ppt: 'ppt', pptx: 'ppt',
      pdf: 'pdf',
      png: 'image', jpg: 'image', jpeg: 'image', gif: 'image', bmp: 'image', webp: 'image', svg: 'image',
      mp4: 'video', avi: 'video', mkv: 'video', mov: 'video', wmv: 'video',
      mp3: 'audio', wav: 'audio', flac: 'audio', aac: 'audio',
      py: 'code', js: 'code', html: 'code', css: 'code', java: 'code', json: 'code', xml: 'code',
      iso: 'disk', img: 'disk',
    };

    // 类型 → 线性 SVG 图标（stroke 用 currentColor，颜色由 CSS 主题控制）
    const FILE_ICON_SVGS = {
      file: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/>',
      exe: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="m7 9 3 3-3 3"/><path d="M12 15h5"/>',
      archive: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="10 2 10 6 14 6 14 10"/><path d="M9 13h6"/><path d="M9 17h4"/>',
      text: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><path d="M9 13h6"/><path d="M9 17h6"/>',
      word: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><path d="M9 12h6"/><path d="M9 15h6"/><path d="M9 18h3"/>',
      excel: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><path d="M9 12h2"/><path d="M13 12h2"/><path d="M9 15h2"/><path d="M13 15h2"/><path d="M9 18h2"/><path d="M13 18h2"/>',
      ppt: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><path d="M12 11v6"/><path d="M9 14h6"/>',
      pdf: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><path d="M9 16c0-2 2-2 3-2s3 0 3 2-2 2-3 2-3 0-3-2z"/>',
      image: '<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/>',
      video: '<rect x="2" y="6" width="14" height="12" rx="2"/><path d="m22 8-6 4 6 4V8Z"/>',
      audio: '<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>',
      code: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><path d="m10 9-3 3 3 3"/><path d="m14 9 3 3-3 3"/>',
      disk: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="1.5"/><path d="M12 3v9"/>',
    };

    function getFileIcon(filename) {
      const ext = String(filename || '').split('.').pop().toLowerCase();
      const type = FILE_ICON_EXT_TYPES[ext] || 'file';
      return { svg: FILE_ICON_SVGS[type] || FILE_ICON_SVGS.file, type };
    }

    function getSource(item) {
      try {
        if (item && item.url) return new URL(item.url).hostname.replace(/^www\./, '');
      } catch (e) { /* ignore */ }
      return '';
    }

    function formatBytes(bytes) {
      const value = Number(bytes) || 0;
      if (value <= 0) return '未知大小';
      const k = 1024;
      const sizes = ['B', 'KB', 'MB', 'GB'];
      const i = Math.min(sizes.length - 1, Math.floor(Math.log(value) / Math.log(k)));
      return parseFloat((value / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
    }

    function formatSpeed(bps) {
      const value = Number(bps) || 0;
      return value > 0 ? formatBytes(value) + '/s' : '';
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text || '';
      return div.innerHTML;
    }

    function actionBtn(title, className, iconKey, handler) {
      const btn = document.createElement('button');
      btn.className = 'action-btn ' + className;
      btn.title = title;
      btn.setAttribute('aria-label', title);
      btn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + (ACTION_ICONS[iconKey] || '') + '</svg>';
      btn.addEventListener('click', handler);
      return btn;
    }

    async function loadDownloads() {
      try {
        downloads = (await api.getDownloads()) || [];
      } catch (e) {
        downloads = [];
      }
      render();
    }

    function filtered() {
      return downloads.filter((item) => {
        if (state.filter === 'completed' && item.state !== 'completed') return false;
        if (state.filter === 'cancelled' && item.state !== 'cancelled' && item.state !== 'deleted') return false;
        if (state.filter === 'failed' && item.state !== 'failed') return false;
        if (state.query) {
          const f = String(item.filename || '').toLowerCase();
          const u = String(item.url || '').toLowerCase();
          if (!f.includes(state.query) && !u.includes(state.query)) return false;
        }
        return true;
      });
    }

    function buildSubtitle(item) {
      const parts = [];
      const src = getSource(item);
      if (src) parts.push(src);
      if (item.state === 'in_progress') {
        parts.push(item.totalBytes > 0 ? formatBytes(item.receivedBytes) + ' / ' + formatBytes(item.totalBytes) : formatBytes(item.receivedBytes));
        if (item.speed) parts.push(formatSpeed(item.speed));
      } else if (item.state === 'paused') {
        parts.push(formatBytes(item.receivedBytes));
      } else if (item.state === 'completed') {
        parts.push(formatBytes(item.totalBytes));
        parts.push(new Date(item.endTime || item.startTime).toLocaleString('zh-CN'));
      } else if (item.state === 'failed') parts.push('下载失败');
      else if (item.state === 'cancelled') parts.push('已取消');
      else if (item.state === 'deleted') parts.push('已删除');
      return parts.join(' · ');
    }

    function getStatusInfo(item, pct) {
      switch (item.state) {
        case 'in_progress': return { cls: 'status--progress', text: pct + '%' };
        case 'paused': return { cls: 'status--progress', text: '已暂停' };
        case 'completed': return { cls: 'status--done', text: '已完成' };
        case 'failed': return { cls: 'status--failed', text: '失败' };
        case 'cancelled': return { cls: 'status--muted', text: '已取消' };
        case 'deleted': return { cls: 'status--muted', text: '已删除' };
        default: return { cls: 'status--muted', text: '' };
      }
    }

    // 增量更新已渲染的下载项（实时进度，避免全量重建导致进度条动画从 0 重置）
    function updateDownloadRow(item) {
      const row = document.querySelector('#downloadList .list-item[data-id="' + item.id + '"]');
      if (!row) return false;

      // 暂停 / 状态切换（完成/取消/失败等）：操作按钮需切换（暂停↔继续、出现重新开始等），
      // 增量更新无法覆盖，直接全量重建列表
      if (item.state !== 'in_progress') {
        render();
        return true;
      }

      // 下载中：增量更新进度条 + 副标题 + 状态（实时进度）
      // 兜底：数据已 100% 接收但状态未切换为 completed，直接全量重建（render 会按已完成展示）
      if (item.totalBytes > 0 && item.receivedBytes >= item.totalBytes) {
        render();
        return true;
      }
      // 若行内仍是「继续」按钮（刚从暂停恢复），先重建切换为「暂停」
      if (row.querySelector('.action-btn[title="继续"]')) {
        render();
        return true;
      }
      let pct = item.totalBytes > 0 ? Math.min(100, Math.round((item.receivedBytes / item.totalBytes) * 100)) : 0;
      const bar = row.querySelector('.list-item__progress-bar');
      if (bar) {
        // 临时禁用过渡，避免从 0 重新动画
        bar.style.transition = 'none';
        bar.style.width = pct + '%';
        requestAnimationFrame(() => { bar.style.transition = ''; });
      }

      // 副标题（大小 / 速度 / 时间）
      const subtitle = row.querySelector('.list-item__subtitle');
      if (subtitle) subtitle.textContent = buildSubtitle(item);

      // 状态标签
      const statusEl = row.querySelector('.list-item__status');
      if (statusEl) {
        const info = getStatusInfo(item, pct);
        statusEl.className = 'list-item__status ' + info.cls;
        statusEl.textContent = info.text;
      }
      return true;
    }

    function render() {
      const container = document.getElementById('downloadList');
      const items = filtered();

      if (items.length === 0) {
        const emptyText = {
          all: '还没有下载内容',
          completed: '没有已完成的下载',
          cancelled: '没有已取消的下载',
          failed: '没有失败的下载',
        }[state.filter];
        container.innerHTML = '<div class="empty"><div class="empty__icon">📥</div><div class="empty__text">' + emptyText + '</div></div>';
        return;
      }

      container.innerHTML = '';
      items.forEach((item) => {
        const row = document.createElement('div');
        row.className = 'list-item' + (item.state === 'cancelled' || item.state === 'deleted' ? ' list-item--inactive' : '');
        row.dataset.id = item.id;

        // 文件图标：优先真实系统图标（资源管理器风格，异步获取），加载期间/文件不存在时用类型 SVG 兜底
        const icon = getFileIcon(item.filename);
        const iconEl = document.createElement('div');
        iconEl.className = 'list-item__icon dl-icon dl-icon--' + icon.type;
        iconEl.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + icon.svg + '</svg>';
        if (api && api.getDownloadFileIcon) {
          api.getDownloadFileIcon(item.id).then((dataUrl) => {
            if (dataUrl && iconEl.isConnected) {
              iconEl.innerHTML = '';
              iconEl.className = 'list-item__icon';
              const img = document.createElement('img');
              img.className = 'list-item__real-icon';
              img.src = dataUrl;
              img.draggable = false;
              iconEl.appendChild(img);
            }
          }).catch(() => {});
        }

        // 内容区
        const content = document.createElement('div');
        content.className = 'list-item__content';

        const titleRow = document.createElement('div');
        titleRow.className = 'list-item__title-row';
        const title = document.createElement('div');
        title.className = 'list-item__title';
        if (item.state === 'failed') title.classList.add('list-item__title--danger');
        title.textContent = item.filename || '未命名文件';
        title.title = item.filename || '';
        titleRow.appendChild(title);
        content.appendChild(titleRow);

        const subtitle = document.createElement('div');
        subtitle.className = 'list-item__subtitle';
        subtitle.textContent = buildSubtitle(item);
        content.appendChild(subtitle);

        // 进度
        let pct = 0;
        if (item.state === 'in_progress' || item.state === 'paused') {
          pct = item.totalBytes > 0 ? Math.min(100, Math.round((item.receivedBytes / item.totalBytes) * 100)) : 0;
          const progress = document.createElement('div');
          progress.className = 'list-item__progress';
          const bar = document.createElement('div');
          bar.className = 'list-item__progress-bar' + (item.state === 'paused' ? ' list-item__progress-bar--paused' : '');
          bar.style.width = pct + '%';
          progress.appendChild(bar);
          content.appendChild(progress);
        }

        // 状态
        const statusInfo = getStatusInfo(item, pct);
        const statusClass = statusInfo.cls;
        const statusText = statusInfo.text;

        // 操作
        const actions = document.createElement('div');
        actions.className = 'list-item__actions';

        if (item.state === 'in_progress') {
          actions.appendChild(actionBtn('暂停', 'action-btn--accent', 'pause', async () => { await api.pauseDownload(item.id); }));
        } else if (item.state === 'paused') {
          actions.appendChild(actionBtn('继续', 'action-btn--accent', 'play', async () => { await api.resumeDownload(item.id); }));
        }
        if (item.state === 'in_progress' || item.state === 'paused') {
          actions.appendChild(actionBtn('取消', 'action-btn--danger', 'cancel', async () => { await api.cancelDownload(item.id); }));
        }
        if (item.state === 'completed') {
          actions.appendChild(actionBtn('打开文件', '', 'open', async () => {
            const res = await api.openDownloadFile(item.id);
            if (res && res.ok === false) showToast(res.fallback ? '打开失败，已定位到所在文件夹' : '文件不存在或已被移动', 'error');
          }));
        }
        // 已取消/失败：可重新开始下载
        if (item.state === 'cancelled' || item.state === 'failed') {
          actions.appendChild(actionBtn('重新开始', '', 'restart', async () => { await api.retryDownload(item.id); }));
        }
        if (item.state !== 'deleted') {
          actions.appendChild(actionBtn('打开文件夹', '', 'folder', async () => {
            const res = await api.openDownloadFolder(item.id);
            if (res && res.ok === false) showToast('文件不存在或已被移动', 'error');
          }));
        }
        if (item.url) {
          actions.appendChild(actionBtn('复制链接', '', 'link', async () => { await api.copyText(item.url); }));
        }
        actions.appendChild(actionBtn('删除', 'action-btn--danger', 'trash', async () => {
          await api.deleteDownload(item.id);
          await loadDownloads();
        }));

        const statusEl = document.createElement('span');
        statusEl.className = 'list-item__status ' + statusClass;
        statusEl.textContent = statusText;

        row.appendChild(iconEl);
        row.appendChild(content);
        row.appendChild(statusEl);
        row.appendChild(actions);

        // 右键菜单：重新开始 / 复制下载链接 / 打开文件 / 打开文件夹 / 从列表移除
        row.addEventListener('contextmenu', (e) => {
          e.preventDefault();
          e.stopPropagation();
          showDownloadContextMenu(e.clientX, e.clientY, item);
        });

        container.appendChild(row);
      });
    }

    // 下载项右键菜单
    const ctxMenu = document.getElementById('ctxMenu');
    function showDownloadContextMenu(x, y, item) {
      ctxMenu.innerHTML = '';
      const addItem = (label, action, danger) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'ctx-menu__item' + (danger ? ' ctx-menu__item--danger' : '');
        b.textContent = label;
        b.addEventListener('click', () => {
          ctxMenu.style.display = 'none';
          action();
        });
        ctxMenu.appendChild(b);
      };
      if (item.state === 'cancelled' || item.state === 'failed') {
        addItem('重新开始', async () => { await api.retryDownload(item.id); });
      }
      if (item.url) {
        addItem('复制下载链接', async () => { await api.copyText(item.url); });
      }
      if (item.state === 'completed') {
        addItem('打开文件', async () => {
          const res = await api.openDownloadFile(item.id);
          if (res && res.ok === false) showToast(res.fallback ? '打开失败，已定位到所在文件夹' : '文件不存在或已被移动', 'error');
        });
      }
      if (item.state !== 'deleted') {
        addItem('打开文件夹', async () => {
          const res = await api.openDownloadFolder(item.id);
          if (res && res.ok === false) showToast('文件不存在或已被移动', 'error');
        });
      }
      addItem('从列表移除', async () => { await api.deleteDownload(item.id); await loadDownloads(); }, true);
      if (!ctxMenu.children.length) return;
      ctxMenu.style.display = 'block';
      ctxMenu.style.left = Math.min(x, window.innerWidth - 180) + 'px';
      ctxMenu.style.top = Math.min(y, window.innerHeight - 230) + 'px';
    }
    document.addEventListener('click', () => { ctxMenu.style.display = 'none'; });
    document.addEventListener('contextmenu', (e) => {
      if (!ctxMenu.contains(e.target)) ctxMenu.style.display = 'none';
    });

    // 事件绑定
    document.querySelectorAll('.filter-tab').forEach((tab) => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.filter-tab').forEach((t) => t.classList.remove('active'));
        tab.classList.add('active');
        state.filter = tab.dataset.filter;
        render();
      });
    });

    document.getElementById('searchInput').addEventListener('input', (e) => {
      state.query = e.target.value.trim().toLowerCase();
      render();
    });

    document.getElementById('btnClear').addEventListener('click', async () => {
      if (confirm('确定要清空所有下载记录吗？此操作无法撤销。')) {
        await api.clearDownloads();
        await loadDownloads();
      }
    });

    // 监听下载更新：先同步本地数组，再对已渲染的行做增量更新（实时进度），
    // 行不存在或状态切换时全量重建（进度条移除、打开按钮出现）
    if (api.onDownloadsUpdated) {
      api.onDownloadsUpdated((data) => {
        if (!data || !data.id) return;
        const idx = downloads.findIndex((d) => d.id === data.id);
        if (idx !== -1) downloads[idx] = { ...downloads[idx], ...data };
        else downloads.unshift(data);
        if (!updateDownloadRow(data)) {
          loadDownloads();
        }
      });
    }

    loadDownloads();
  </script>
</body>
</html>
