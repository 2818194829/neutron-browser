appId: com.neutron.browser
productName: Neutron Browser
copyright: Copyright © 2024 Neutron Browser Team
directories:
  output: build
  buildResources: assets
publish:
  provider: github
  owner: 2818194829
  repo: neutron-browser
  releaseType: release
files:
  - src/**/*
  - assets/**/*
  - icon/**/*
  - package.json
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: assets/icons/icon.ico
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: assets/icons/icon.icns
  category: public.app-category.productivity
linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  icon: assets/icons
  category: Network
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Neutron Browser
  installerIcon: assets/icons/icon.ico
  uninstallerIcon: assets/icons/icon.ico
  installerHeaderIcon: assets/icons/icon.ico
